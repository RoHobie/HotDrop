spring:
  application:
    name: hotdrop
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:hotdrop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000
  threads:
    virtual:
      enabled: true
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

hotdrop:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  queue:
    admission-batch-size: ${ADMISSION_BATCH_SIZE:50}
    admission-validity-seconds: ${ADMISSION_VALIDITY_SECONDS:120}
    admission-poll-rate-ms: ${ADMISSION_POLL_RATE_MS:3000}
    status-scheduler-rate-ms: ${STATUS_SCHEDULER_RATE_MS:2000}
